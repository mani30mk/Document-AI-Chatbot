<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAG Study Assistant</title>
<style>
  /* ── Reset & base ─────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:        #f7f7f5;
    --surface:   #ffffff;
    --surface2:  #f1f0ed;
    --border:    rgba(0,0,0,0.1);
    --text:      #1a1a18;
    --muted:     #6b6b68;
    --accent:    #3b6ef6;
    --accent-h:  #2d5ce0;
    --accent-bg: #edf1fe;
    --danger:    #d94f4f;
    --success:   #2a9d63;
    --radius:    8px;
    --shadow:    0 2px 12px rgba(0,0,0,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:        #1c1c1a;
      --surface:   #252523;
      --surface2:  #2e2e2b;
      --border:    rgba(255,255,255,0.1);
      --text:      #f0ede8;
      --muted:     #9e9b96;
      --accent-bg: #1e2a50;
    }
  }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; margin: 0; padding: 0; overflow: hidden; display: flex; flex-direction: column; }

  /* ── Top nav ──────────────────────────────────────────── */
  nav { display: flex; align-items: center; gap: 10px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
  nav .logo { font-size: 15px; font-weight: 600; }
  nav .logo span { color: var(--accent); }
  .nav-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .key-input { font-size: 12px; padding: 5px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface2); color: var(--text); width: 200px; }
  .btn { font-size: 12px; padding: 5px 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--surface2); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-h); border-color: var(--accent-h); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
  .status-dot.ok { background: var(--success); }
  .status-dot.err { background: var(--danger); }
  .status-label { font-size: 12px; color: var(--muted); }

  /* ── Layout ───────────────────────────────────────────── */
  .layout { display: grid; grid-template-columns: 260px 1fr; flex: 1; overflow: hidden; }

  /* ── Sidebar ──────────────────────────────────────────── */
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .sidebar-head { padding: 14px 16px 10px; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; border-bottom: 1px solid var(--border); }
  .upload-zone { margin: 12px; border: 1.5px dashed var(--border); border-radius: var(--radius); padding: 16px; text-align: center; cursor: pointer; transition: background .15s, border-color .15s; }
  .upload-zone:hover, .upload-zone.drag { background: var(--accent-bg); border-color: var(--accent); }
  .upload-zone svg { width: 24px; height: 24px; stroke: var(--muted); margin-bottom: 6px; }
  .upload-zone p { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .upload-zone input { display: none; }
  .file-list { flex: 1; overflow-y: auto; padding: 4px 8px 8px; }
  .empty-state { padding: 20px; text-align: center; color: var(--muted); font-size: 12px; }
  .file-card { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius); cursor: pointer; transition: background .12s; user-select: none; }
  .file-card:hover { background: var(--surface2); }
  .file-card.active { background: var(--accent-bg); }
  .file-card.active .fname { color: var(--accent); }
  .file-ext-badge { font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: var(--surface2); color: var(--muted); flex-shrink: 0; letter-spacing: 0.04em; min-width: 30px; text-align: center; }
  .file-ext-badge.pdf { background: #fdeaea; color: #c0392b; }
  .file-ext-badge.docx { background: #e8f0fe; color: #1a56db; }
  .file-ext-badge.pptx { background: #fff0e6; color: #b45309; }
  .file-ext-badge.txt { background: var(--surface2); color: var(--muted); }
  .file-info { flex: 1; min-width: 0; }
  .fname { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fmeta { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .del-btn { font-size: 16px; color: var(--muted); opacity: 0; background: none; border: none; cursor: pointer; line-height: 1; padding: 0 2px; }
  .file-card:hover .del-btn { opacity: 1; }
  .uploading-indicator { font-size: 11px; color: var(--accent); padding: 4px 10px; }
  .upload-progress-card {
    margin: 0 12px 10px;
    padding: 10px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 11px;
  }
  .progress-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 500;
  }
  .progress-status {
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 170px;
  }
  .progress-percent {
    color: var(--accent);
    font-weight: 600;
  }
  .progress-bar-bg {
    width: 100%;
    height: 6px;
    background: rgba(0,0,0,0.08);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.2s ease;
  }
  .progress-bar-fill.done { background: var(--success); }
  .progress-bar-fill.error { background: var(--danger); }

  /* ── Main content ─────────────────────────────────────── */
  .main { display: flex; flex-direction: column; overflow: hidden; }
  .content-bar { display: flex; align-items: center; gap: 10px; padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--surface); font-size: 13px; }
  .content-bar .file-label { font-weight: 500; }
  .content-bar .tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--accent-bg); color: var(--accent); }
  .viewer { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  .viewer-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--muted); gap: 8px; }
  .viewer-empty svg { width: 40px; height: 40px; stroke: var(--border); }
  .viewer-empty p { font-size: 13px; }
  .file-preview-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; max-width: 700px; }
  .fp-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .fp-icon { width: 40px; height: 40px; border-radius: 8px; background: var(--accent-bg); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .fp-title { font-size: 15px; font-weight: 600; }
  .fp-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .fp-divider { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .fp-info { font-size: 13px; color: var(--muted); line-height: 1.7; background: var(--surface2); border-radius: var(--radius); padding: 12px 14px; }
  .fp-pipeline { margin-top: 14px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .pipeline-step { background: var(--surface2); border-radius: var(--radius); padding: 8px 10px; font-size: 11px; }
  .pipeline-step .step-label { color: var(--muted); margin-bottom: 2px; }
  .pipeline-step .step-val { font-weight: 600; font-size: 12px; }

  /* ── PPT Viewer ───────────────────────────────────────── */
  .ppt-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    align-items: center;
    justify-content: space-between;
    padding: 10px;
    gap: 12px;
    user-select: none;
  }
  .ppt-slide-wrapper {
    flex: 1;
    width: 100%;
    max-width: 820px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .ppt-slide {
    width: 100%;
    aspect-ratio: 16 / 9;
    max-height: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    padding: 28px 36px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    overflow-y: auto;
    position: relative;
    transition: transform 0.15s ease;
  }
  .ppt-slide-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 12px;
    margin-bottom: 18px;
  }
  .ppt-slide-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
  }
  .ppt-slide-badge {
    font-size: 11px;
    font-weight: 600;
    background: var(--accent-bg);
    color: var(--accent);
    padding: 3px 8px;
    border-radius: 12px;
    white-space: nowrap;
  }
  .ppt-slide-body {
    flex: 1;
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
  }
  .ppt-bullet-list {
    list-style: none;
    padding-left: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .ppt-bullet-item {
    position: relative;
    padding-left: 20px;
  }
  .ppt-bullet-item::before {
    content: "•";
    color: var(--accent);
    font-weight: bold;
    font-size: 18px;
    position: absolute;
    left: 4px;
    top: -2px;
  }
  .ppt-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--surface);
    padding: 8px 18px;
    border-radius: 30px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .ppt-ctrl-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 4px;
    transition: background .15s;
  }
  .ppt-ctrl-btn:hover:not(:disabled) {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .ppt-ctrl-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .ppt-counter {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    min-width: 80px;
    text-align: center;
  }

  /* ── DOCX Viewer ──────────────────────────────────────── */
  .docx-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow-y: auto;
    background: var(--bg);
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .docx-paper {
    background: var(--surface);
    width: 100%;
    max-width: 750px;
    min-height: 100%;
    padding: 40px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    font-size: 14px;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
    font-family: inherit;
  }

  /* ── Chat panel ───────────────────────────────────────── */
  .chat-fab { position: fixed; bottom: 24px; right: 24px; width: 48px; height: 48px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 22px; box-shadow: var(--shadow); transition: transform .15s, background .15s; z-index: 100; }
  .chat-fab:hover { background: var(--accent-h); transform: scale(1.06); }
  .chat-fab.open { background: #555; }
  .chat-window { position: fixed; bottom: 82px; right: 24px; width: 360px; max-height: 540px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; display: flex; flex-direction: column; box-shadow: var(--shadow); z-index: 99; transition: opacity .15s, transform .15s; }
  .chat-window.hidden { opacity: 0; pointer-events: none; transform: translateY(10px); }
  .chat-win-header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .chat-win-header .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-bg); display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 14px; }
  .chat-win-header .title { font-size: 13px; font-weight: 600; }
  .chat-win-header .subtitle { font-size: 11px; color: var(--muted); }
  .chat-history-badge { margin-left: auto; font-size: 11px; color: var(--muted); background: var(--surface2); padding: 2px 8px; border-radius: 20px; }
  .clear-btn { font-size: 11px; color: var(--muted); background: none; border: none; cursor: pointer; padding: 2px 6px; }
  .clear-btn:hover { color: var(--danger); }
  .chat-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 200px; max-height: 380px; }
  .bubble { max-width: 88%; font-size: 13px; line-height: 1.55; padding: 9px 12px; border-radius: 12px; word-break: break-word; }
  .bubble.bot { background: var(--surface2); color: var(--text); align-self: flex-start; border-bottom-left-radius: 3px; }
  .bubble.user { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 3px; }
  .bubble.typing { color: var(--muted); font-style: italic; }
  .bubble.error { background: #fdeaea; color: #c0392b; border: 1px solid #f5c6c6; }
  .sources-tag { font-size: 10px; color: var(--muted); margin-top: 4px; align-self: flex-start; padding-left: 4px; }
  .chat-input-row { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
  .chat-input-row input { flex: 1; font-size: 13px; padding: 8px 11px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface2); color: var(--text); outline: none; }
  .chat-input-row input:focus { border-color: var(--accent); }
  .send-btn { width: 34px; height: 34px; border-radius: var(--radius); background: var(--accent); border: none; cursor: pointer; color: #fff; font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .send-btn:hover { background: var(--accent-h); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── Toast ────────────────────────────────────────────── */
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); font-size: 12px; padding: 8px 16px; border-radius: 20px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 200; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- Top nav -->
<nav>
  <div class="logo">📚 <span>Study</span>RAG</div>
  <div class="nav-right">
    <div class="status-dot ok" id="statusDot"></div>
    <span class="status-label" id="statusLabel">Connected</span>
  </div>
</nav>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-head">Study files</div>
    <label class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" multiple accept=".pdf,.txt,.docx,.pptx" />
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M12 12V4M8 8l4-4 4 4"/>
      </svg>
      <p>Drop files or click to upload<br/><span style="font-size:10px">PDF · DOCX · PPTX · TXT</span></p>
    </label>
    <div id="uploadProgressContainer" class="upload-progress-card" style="display:none">
      <div class="progress-info">
        <span id="progressStatus" class="progress-status">Uploading…</span>
        <span id="progressPercent" class="progress-percent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progressBar" class="progress-bar-fill" style="width: 0%"></div>
      </div>
    </div>
    <div class="file-list" id="fileList">
      <div class="empty-state">No files yet.<br/>Upload study material above.</div>
    </div>
  </aside>

  <!-- Main area -->
  <main class="main">
    <div class="content-bar">
      <span class="file-label" id="contentTitle">Select a file to preview</span>
      <span class="tag" id="fileCountTag">0 files</span>
    </div>
    <div class="viewer" id="viewer">
      <div class="viewer-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 12h6M9 16h6M7 4H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2h-2"/>
          <path d="M9 4h6v4H9V4z"/>
        </svg>
        <p>Upload files and click one to preview it</p>
      </div>
    </div>
  </main>
</div>

<!-- Chat FAB -->
<button class="chat-fab" id="chatFab" onclick="toggleChat()" title="Open RAG chatbot">💬</button>

<!-- Chat window -->
<div class="chat-window hidden" id="chatWindow">
  <div class="chat-win-header">
    <div class="avatar">🤖</div>
    <div>
      <div class="title">RAG assistant</div>
      <div class="subtitle" id="chatSubtitle">Upload files to begin</div>
    </div>
    <span class="chat-history-badge" id="historyBadge">0 turns</span>
    <button class="clear-btn" onclick="clearHistory()" title="Clear conversation">✕ Clear</button>
  </div>
  <div class="chat-messages" id="chatMessages">
    <div class="bubble bot">Hi! Upload your study files on the left, then ask me anything about them.</div>
  </div>
  <div class="chat-input-row">
    <input type="text" id="chatInput" placeholder="Ask about your files…" onkeydown="if(event.key==='Enter')sendMessage()" />
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Config ────────────────────────────────────────────────
const API_BASE = (window.location.origin && window.location.origin.startsWith('http'))
  ? window.location.origin
  : 'http://localhost:8000';

// ── State ─────────────────────────────────────────────────
let sessionId = null;
let chatOpen = false;
let turnCount = 0;
let files = [];   // { name, size, ext }
let activeIdx = null;
let isSending = false;

// ── Session init ──────────────────────────────────────────
async function initSession() {
  try {
    const res = await fetch(`${API_BASE}/session/new`, { method: 'POST' });
    if (!res.ok) throw new Error();
    const data = await res.json();
    sessionId = data.session_id;
    setStatus(true);
  } catch {
    setStatus(false);
    showToast('Cannot reach backend. Is the server running?');
  }
}

// Auto-initialize session on load
window.addEventListener('DOMContentLoaded', initSession);

function setStatus(ok) {
  document.getElementById('statusDot').className = 'status-dot ' + (ok ? 'ok' : 'err');
  document.getElementById('statusLabel').textContent = ok ? 'Connected' : 'Disconnected';
  document.getElementById('chatSubtitle').textContent = ok
    ? (files.length ? `${files.length} file(s) loaded` : 'Upload files to begin')
    : 'Connecting…';
}

// ── File upload ───────────────────────────────────────────
const EXT_ICONS = { pdf:'📄', docx:'📝', pptx:'📊', txt:'🗒️' };

document.getElementById('fileInput').addEventListener('change', async function () {
  await uploadFiles(Array.from(this.files));
  this.value = '';
});

const zone = document.getElementById('uploadZone');
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
zone.addEventListener('drop', async e => {
  e.preventDefault(); zone.classList.remove('drag');
  await uploadFiles(Array.from(e.dataTransfer.files));
});

function updateProgress(percent, text, state) {
  const container = document.getElementById('uploadProgressContainer');
  const bar = document.getElementById('progressBar');
  const status = document.getElementById('progressStatus');
  const pct = document.getElementById('progressPercent');

  container.style.display = 'flex';
  bar.style.width = Math.min(100, Math.max(0, percent)) + '%';
  bar.className = 'progress-bar-fill' + (state ? ' ' + state : '');
  status.textContent = text;
  pct.textContent = Math.round(percent) + '%';
}

function hideProgress(delay = 2500) {
  setTimeout(() => {
    const container = document.getElementById('uploadProgressContainer');
    container.style.display = 'none';
  }, delay);
}

async function uploadFiles(fileList) {
  if (!fileList.length) return;

  if (!sessionId) {
    updateProgress(10, 'Connecting to server…', '');
    await initSession();
    if (!sessionId) {
      updateProgress(100, 'Cannot connect to server', 'error');
      showToast('Backend connection failed. Is the server running?');
      hideProgress(4000);
      return;
    }
  }

  const form = new FormData();
  fileList.forEach(f => form.append('files', f));

  updateProgress(5, `Uploading ${fileList.length} file(s)…`, '');

  const xhr = new XMLHttpRequest();
  xhr.open('POST', `${API_BASE}/upload/${sessionId}`);

  // 1. Client-to-server upload progress (0% - 65%)
  xhr.upload.onprogress = function (e) {
    if (e.lengthComputable) {
      const pct = Math.round((e.loaded / e.total) * 65);
      updateProgress(pct, `Uploading ${fileList.length} file(s) (${pct}%)…`, '');
    }
  };

  // 2. Upload complete, server is parsing text and indexing vectors (70% - 90%)
  xhr.upload.onload = function () {
    updateProgress(75, 'Extracting text & indexing vectors…', '');
  };

  // 3. Response received
  xhr.onload = function () {
    let data;
    try {
      data = JSON.parse(xhr.responseText);
    } catch {
      data = {};
    }

    if (xhr.status >= 200 && xhr.status < 300) {
      if (data.error) {
        updateProgress(100, data.error, 'error');
        showToast('Upload error: ' + data.error);
        hideProgress(5000);
        return;
      }

      updateProgress(100, `✓ Indexed ${data.chunks || 0} chunks!`, 'done');
      fileList.forEach(f => files.push({ 
        name: f.name, 
        size: f.size, 
        ext: f.name.split('.').pop().toLowerCase(), 
        url: URL.createObjectURL(f), 
        rawFile: f 
      }));
      renderFileList();
      showToast(`✓ ${fileList.length} file(s) indexed (${data.chunks} chunks)`);
      document.getElementById('chatSubtitle').textContent = `${files.length} file(s) loaded`;
      document.getElementById('fileCountTag').textContent = files.length + ' file' + (files.length !== 1 ? 's' : '');
      hideProgress(2500);
    } else {
      const errorDetail = data.detail || data.error || `Server error (${xhr.status})`;
      updateProgress(100, errorDetail, 'error');
      showToast(`Upload failed: ${errorDetail}`);
      hideProgress(5000);
    }
  };

  xhr.onerror = function () {
    updateProgress(100, 'Network connection error', 'error');
    showToast('Network error — cannot reach server');
    hideProgress(4000);
  };

  xhr.send(form);
}

function renderFileList() {
  const list = document.getElementById('fileList');
  if (!files.length) {
    list.innerHTML = '<div class="empty-state">No files yet.<br/>Upload study material above.</div>';
    return;
  }
  list.innerHTML = files.map((f, i) => `
    <div class="file-card${activeIdx === i ? ' active' : ''}" onclick="selectFile(${i})">
      <span class="file-ext-badge ${f.ext}">${f.ext.toUpperCase()}</span>
      <div class="file-info">
        <div class="fname">${f.name}</div>
        <div class="fmeta">${fmtSize(f.size)}</div>
      </div>
      <button class="del-btn" onclick="removeFile(event,${i})" title="Remove">×</button>
    </div>
  `).join('');
}

let currentPptSlides = [];
let currentPptIndex = 0;

function renderPptSlide(idx) {
  if (!currentPptSlides.length) return;
  currentPptIndex = Math.max(0, Math.min(idx, currentPptSlides.length - 1));
  const s = currentPptSlides[currentPptIndex];
  
  const titleEl = document.getElementById('pptSlideTitle');
  const badgeEl = document.getElementById('pptSlideBadge');
  const bodyEl = document.getElementById('pptSlideBody');
  const counterEl = document.getElementById('pptCounter');
  const prevBtn = document.getElementById('pptPrevBtn');
  const nextBtn = document.getElementById('pptNextBtn');

  if (titleEl) titleEl.textContent = s.title || `Slide ${s.slide_number}`;
  if (badgeEl) badgeEl.textContent = `Slide ${s.slide_number} of ${currentPptSlides.length}`;
  if (counterEl) counterEl.textContent = `${s.slide_number} / ${currentPptSlides.length}`;
  if (prevBtn) prevBtn.disabled = currentPptIndex === 0;
  if (nextBtn) nextBtn.disabled = currentPptIndex === currentPptSlides.length - 1;

  if (bodyEl) {
    if (s.bullets && s.bullets.length > 0) {
      bodyEl.innerHTML = `
        <ul class="ppt-bullet-list">
          ${s.bullets.map(b => `<li class="ppt-bullet-item">${b}</li>`).join('')}
        </ul>
      `;
    } else if (s.raw_text) {
      bodyEl.innerHTML = `<div style="white-space: pre-wrap; line-height: 1.6;">${s.raw_text}</div>`;
    } else {
      bodyEl.innerHTML = `<div style="color: var(--muted); font-style: italic;">(Empty slide)</div>`;
    }
  }
}

function prevPptSlide() {
  if (currentPptIndex > 0) renderPptSlide(currentPptIndex - 1);
}

function nextPptSlide() {
  if (currentPptIndex < currentPptSlides.length - 1) renderPptSlide(currentPptIndex + 1);
}

// Arrow key navigation for PPT
window.addEventListener('keydown', e => {
  if (activeIdx !== null && files[activeIdx] && (files[activeIdx].ext === 'pptx' || files[activeIdx].ext === 'ppt')) {
    if (e.key === 'ArrowLeft') prevPptSlide();
    if (e.key === 'ArrowRight') nextPptSlide();
  }
});

async function loadPptxViewer(filename) {
  const container = document.getElementById('pptViewerMount');
  if (!container) return;
  
  try {
    const res = await fetch(`${API_BASE}/slides/${sessionId}/${encodeURIComponent(filename)}`);
    if (!res.ok) throw new Error('Slides endpoint returned ' + res.status);
    const data = await res.json();
    currentPptSlides = data.slides || [];
    currentPptIndex = 0;

    if (!currentPptSlides.length) {
      container.innerHTML = `<div class="viewer-empty"><p>No slides found in this presentation.</p></div>`;
      return;
    }

    container.innerHTML = `
      <div class="ppt-container">
        <div class="ppt-slide-wrapper">
          <div class="ppt-slide">
            <div class="ppt-slide-header">
              <div class="ppt-slide-title" id="pptSlideTitle"></div>
              <div class="ppt-slide-badge" id="pptSlideBadge"></div>
            </div>
            <div class="ppt-slide-body" id="pptSlideBody"></div>
          </div>
        </div>
        <div class="ppt-controls">
          <button class="ppt-ctrl-btn" id="pptPrevBtn" onclick="prevPptSlide()">◀ Previous</button>
          <span class="ppt-counter" id="pptCounter">1 / ${currentPptSlides.length}</span>
          <button class="ppt-ctrl-btn" id="pptNextBtn" onclick="nextPptSlide()">Next ▶</button>
        </div>
      </div>
    `;
    renderPptSlide(0);
  } catch (err) {
    container.innerHTML = `
      <div class="viewer-empty">
        <p>Could not load slide preview (${err.message})</p>
      </div>
    `;
  }
}

async function loadDocxViewer(filename) {
  const container = document.getElementById('docxViewerMount');
  if (!container) return;

  try {
    const res = await fetch(`${API_BASE}/document/${sessionId}/${encodeURIComponent(filename)}`);
    if (!res.ok) throw new Error('Document endpoint returned ' + res.status);
    const data = await res.json();
    container.innerHTML = `
      <div class="docx-container">
        <div class="docx-paper">${data.text || '(Empty document)'}</div>
      </div>
    `;
  } catch (err) {
    container.innerHTML = `
      <div class="viewer-empty">
        <p>Could not load document preview (${err.message})</p>
      </div>
    `;
  }
}

function selectFile(i) {
  activeIdx = i;
  renderFileList();
  const f = files[i];
  document.getElementById('contentTitle').textContent = f.name;
  
  let viewerHtml = '';
  
  if (f.ext === 'pdf') {
    viewerHtml = `<iframe src="${f.url}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border:none; border-radius: 8px;"></iframe>`;
  } else if (f.ext === 'txt') {
    viewerHtml = `<div id="txtViewer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; white-space: pre-wrap; font-family: monospace; background: var(--surface2); padding: 20px; border-radius: var(--radius); overflow-y: auto;">Loading text...</div>`;
    const reader = new FileReader();
    reader.onload = e => {
      const el = document.getElementById('txtViewer');
      if (el) el.textContent = e.target.result;
    };
    reader.readAsText(f.rawFile);
  } else if (f.ext === 'pptx' || f.ext === 'ppt') {
    viewerHtml = `<div id="pptViewerMount" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;"><div class="viewer-empty"><p>Loading PowerPoint slides…</p></div></div>`;
  } else if (f.ext === 'docx') {
    viewerHtml = `<div id="docxViewerMount" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;"><div class="viewer-empty"><p>Loading Word document…</p></div></div>`;
  } else {
    const icon = EXT_ICONS[f.ext] || '📄';
    viewerHtml = `
      <div class="file-preview-card">
        <div class="fp-header">
          <div class="fp-icon">${icon}</div>
          <div>
            <div class="fp-title">${f.name}</div>
            <div class="fp-meta">${fmtSize(f.size)} · ${f.ext.toUpperCase()} · Indexed in session</div>
          </div>
        </div>
      </div>`;
  }

  document.getElementById('viewer').innerHTML = `
    <div style="position: absolute; top: 20px; left: 20px; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; justify-content: flex-end; flex-shrink: 0;">
        <button class="btn btn-primary" onclick="summarizeFile('${f.name}')" id="btnSummarize">✨ Summarize File</button>
      </div>
      <div id="viewerContent" style="flex: 1; position: relative; overflow: hidden;">
        ${viewerHtml}
      </div>
      <div id="summaryOverlay" style="display: none; flex-direction: column; flex: 1; background: var(--surface); overflow-y: auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-shrink: 0;">
          <h3 style="font-size: 16px;">File Summary</h3>
          <button class="btn" onclick="toggleSummary(false)">Close Summary</button>
        </div>
        <div id="summaryText" style="line-height: 1.6; white-space: pre-wrap; font-size: 14px; margin-bottom: 20px; flex: 1; overflow-y: auto;"></div>
        <div class="fp-info" style="font-size: 12px; border-top: 1px solid var(--border); padding-top: 12px; flex-shrink: 0;">
          <strong>How this works:</strong> When you upload a document, our backend extracts all its text using LangChain loaders. When you click "Summarize", the full extracted text is retrieved and sent to the <strong>Gemini</strong> model in a single prompt. Thanks to Gemini's large context window, it can read the entire document at once and provide a cohesive, accurate summary.
        </div>
      </div>
    </div>
  `;

  if (f.ext === 'pptx' || f.ext === 'ppt') {
    loadPptxViewer(f.name);
  } else if (f.ext === 'docx') {
    loadDocxViewer(f.name);
  }
}

function removeFile(e, i) {
  e.stopPropagation();
  URL.revokeObjectURL(files[i].url);
  files.splice(i, 1);
  if (activeIdx === i) {
    activeIdx = null;
    document.getElementById('viewer').innerHTML = '<div class="viewer-empty"><p>Select a file to preview it</p></div>';
    document.getElementById('contentTitle').textContent = 'Select a file to preview';
  } else if (activeIdx > i) activeIdx--;
  document.getElementById('fileCountTag').textContent = files.length + ' file' + (files.length !== 1 ? 's' : '');
  renderFileList();
  showToast('File removed from view (still in vector store for this session)');
}

// ── Chat ──────────────────────────────────────────────────
function toggleChat() {
  chatOpen = !chatOpen;
  document.getElementById('chatWindow').classList.toggle('hidden', !chatOpen);
  document.getElementById('chatFab').classList.toggle('open', chatOpen);
  document.getElementById('chatFab').textContent = chatOpen ? '✕' : '💬';
  if (chatOpen) document.getElementById('chatInput').focus();
}

async function sendMessage() {
  if (isSending) return;
  const input = document.getElementById('chatInput');
  const q = input.value.trim();
  if (!q) return;

  if (!sessionId) {
    await initSession();
    if (!sessionId) {
      addBubble('Connecting to server… please try again in a moment.', 'error');
      return;
    }
  }
  if (!files.length) {
    addBubble('Upload at least one study file first, then ask your question.', 'error');
    return;
  }

  input.value = '';
  addBubble(q, 'user');
  const typingBubble = addBubble('Thinking…', 'bot typing');
  isSending = true;
  document.getElementById('sendBtn').disabled = true;

  try {
    const res = await fetch(`${API_BASE}/ask`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, question: q }),
    });
    const data = await res.json();

    if (!res.ok) {
      typingBubble.textContent = data.detail || 'Something went wrong.';
      typingBubble.className = 'bubble error';
    } else {
      typingBubble.textContent = data.answer;
      typingBubble.classList.remove('typing');
      // Sources tag
      const src = document.createElement('div');
      src.className = 'sources-tag';
      src.textContent = `↳ ${data.sources_used} chunk(s) retrieved`;
      typingBubble.after(src);
      turnCount++;
      document.getElementById('historyBadge').textContent = turnCount + ' turn' + (turnCount !== 1 ? 's' : '');
    }
  } catch {
    typingBubble.textContent = 'Connection error — is the backend running?';
    typingBubble.className = 'bubble error';
  } finally {
    isSending = false;
    document.getElementById('sendBtn').disabled = false;
    scrollChat();
  }
}

async function clearHistory() {
  if (!sessionId) return;
  try {
    await fetch(`${API_BASE}/session/${sessionId}/history`, { method: 'DELETE' });
    document.getElementById('chatMessages').innerHTML = '<div class="bubble bot">Conversation cleared. Ask a new question!</div>';
    turnCount = 0;
    document.getElementById('historyBadge').textContent = '0 turns';
    showToast('Conversation history cleared');
  } catch {
    showToast('Could not clear history');
  }
}

function addBubble(text, type) {
  const msgs = document.getElementById('chatMessages');
  const d = document.createElement('div');
  d.className = 'bubble ' + type;
  d.textContent = text;
  msgs.appendChild(d);
  scrollChat();
  return d;
}

function scrollChat() {
  const msgs = document.getElementById('chatMessages');
  msgs.scrollTop = msgs.scrollHeight;
}

// ── Helpers ───────────────────────────────────────────────
function fmtSize(b) {
  return b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
}

function loaderName(ext) {
  return { pdf: 'PyPDFLoader', docx: 'UnstructuredWord', pptx: 'UnstructuredPPTX', txt: 'TextLoader' }[ext] || 'TextLoader';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function toggleSummary(show) {
  document.getElementById('viewerContent').style.display = show ? 'none' : 'block';
  document.getElementById('summaryOverlay').style.display = show ? 'flex' : 'none';
  if (!show) {
    document.getElementById('btnSummarize').style.display = 'inline-block';
  } else {
    document.getElementById('btnSummarize').style.display = 'none';
  }
}

async function summarizeFile(filename) {
  if (!sessionId) {
    await initSession();
    if (!sessionId) {
      showToast('Connecting to server… please try again.');
      return;
    }
  }
  
  const btn = document.getElementById('btnSummarize');
  btn.textContent = '⏳ Summarizing...';
  btn.disabled = true;

  try {
    const res = await fetch(`${API_BASE}/summarize`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, filename: filename }),
    });
    
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Failed to summarize');
    
    document.getElementById('summaryText').textContent = data.summary;
    toggleSummary(true);
    showToast('Summary generated successfully!');
  } catch (e) {
    showToast('Summarization error: ' + e.message);
  } finally {
    btn.textContent = '✨ Summarize File';
    btn.disabled = false;
  }
}
</script>
