services:
  - type: web
    name: document-ai-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: EMBEDDING_SERVICE_URL
        value: https://document-ai-chatbot-7ch2.onrender.com

  - type: web
    name: document-ai-embeddings
    runtime: python
    plan: free
    rootDir: embedding_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
